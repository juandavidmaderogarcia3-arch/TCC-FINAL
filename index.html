              <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
                {!activeStructure ? (
                  <div class="space-y-8 py-4 page-enter">
                    <div class="text-center max-w-3xl mx-auto space-y-4">
                      <span class="inline-flex items-center gap-2 px-4 py-1.5 bg-gradient-to-r from-cyan-500/10 to-fuchsia-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono font-bold rounded-full uppercase tracking-wider shadow-lg">
                        <Icon name="sparkles" className="w-4 h-4 text-fuchsia-400 animate-pulse" />
                        SESIÓN ACTIVA • {userProfile.name.toUpperCase()} ({userProfile.role.toUpperCase()})
                      </span>
                      <h2 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight">
                        Explorador de <span class="neon-gradient-text">Estructuras de Datos</span>
                      </h2>
                      <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                        Selecciona un módulo para visualizar en tiempo real algoritmos con estética de dashboard analítico y direcciones físicas de memoria RAM.
                      </p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {structuresList.map((st) => (
                        <div 
                          key={st.id}
                          onClick={() => { setActiveStructure(st.id); playSound('click'); }}
                          class="group glass-panel hover:bg-[#0c1226] border border-cyan-500/20 hover:border-cyan-400/60 rounded-3xl p-6 cursor-pointer transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-cyan-500/20 flex flex-col justify-between relative overflow-hidden"
                        >
                          <div class="absolute -right-10 -top-10 w-36 h-36 bg-cyan-500/10 rounded-full blur-3xl group-hover:bg-fuchsia-500/20 transition"></div>

                          <div class="space-y-4 relative z-10">
                            <div class="flex items-center justify-between">
                              <div class={`p-3.5 bg-[#090d1a] group-hover:bg-gradient-to-tr ${st.color} text-cyan-400 group-hover:text-black rounded-2xl transition duration-300 shadow-md border border-cyan-500/20 ${st.shadow}`}>
                                <Icon name={st.icon} className="w-7 h-7" />
                              </div>
                              <div class="flex flex-col items-end">
                                <span class="text-[10px] px-2.5 py-0.5 bg-[#090d1a] text-cyan-300 rounded-full font-mono font-bold border border-cyan-500/30">
                                  {st.badge}
                                </span>
                                <span class="text-[10px] font-mono text-fuchsia-400 mt-1 font-bold">{st.O}</span>
                              </div>
                            </div>
                            <h3 class="text-xl font-bold text-white group-hover:text-cyan-300 transition">{st.title}</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">{st.desc}</p>
                          </div>
                          
                          <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs font-mono font-bold text-cyan-400 group-hover:text-fuchsia-300 relative z-10">
                            <span>Abrir Módulo</span>
                            <Icon name="arrow-right" className="w-4 h-4 transition transform group-hover:translate-x-2" />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div class="glass-panel-glow rounded-3xl p-4 md:p-8 shadow-2xl page-enter">
                    {activeStructure === 'arreglo' && <ArregloModulo showToast={showToast} triggerCelebration={triggerCelebration} sound={soundEnabled} animSpeed={animSpeed} />}
                    {activeStructure === 'matriz' && <MatrizModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'lista' && <ListaModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'pila' && <PilaModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'cola' && <ColaModulo showToast={showToast} sound={soundEnabled} />}
                    {activeStructure === 'arbol' && <ArbolModulo showToast={showToast} sound={soundEnabled} animSpeed={animSpeed} />}
                    {activeStructure === 'grafo' && <GrafoModulo showToast={showToast} triggerCelebration={triggerCelebration} sound={soundEnabled} animSpeed={animSpeed} />}
                  </div>
                )}
              </main>
            </div>
          )}
        </div>
      );
    }

    // =========================================================
    // INSPECTOR BIG-O A NIVEL INDUSTRIAL CON PALETA NEÓN
    // =========================================================
    function ComplexityBadge({ access, search, insert, deleteOp, codeSnippet }) {
      const [showCode, setShowCode] = useState(false);

      return (
        <div class="bg-[#080c1b]/90 border border-cyan-500/20 p-4 rounded-2xl space-y-3 font-mono text-xs shadow-xl">
          <div class="flex flex-wrap gap-4 items-center justify-between">
            <span class="text-slate-300 font-sans font-bold flex items-center gap-1.5">
              <Icon name="cpu" className="w-4 h-4 text-cyan-400" /> Complejidad Temporal (Big-O):
            </span>
            <div class="flex flex-wrap gap-3">
              {access && <span class="bg-[#0d1326] border border-cyan-500/30 px-2.5 py-1 rounded-lg text-cyan-300">Acceso: <strong class="text-white">{access}</strong></span>}
              {search && <span class="bg-[#0d1326] border border-blue-500/30 px-2.5 py-1 rounded-lg text-blue-300">Búsqueda: <strong class="text-white">{search}</strong></span>}
              {insert && <span class="bg-[#0d1326] border border-emerald-500/30 px-2.5 py-1 rounded-lg text-emerald-300">Inserción: <strong class="text-white">{insert}</strong></span>}
              {deleteOp && <span class="bg-[#0d1326] border border-rose-500/30 px-2.5 py-1 rounded-lg text-rose-300">Eliminación: <strong class="text-white">{deleteOp}</strong></span>}
            </div>
            {codeSnippet && (
              <button onClick={() => setShowCode(!showCode)} class="text-slate-300 hover:text-white flex items-center gap-1 bg-[#0d1326] px-2.5 py-1 rounded-lg border border-fuchsia-500/30 hover:border-fuchsia-400 transition">
                <Icon name="code" className="w-3.5 h-3.5 text-fuchsia-400" />
                {showCode ? 'Ocultar Código' : 'Ver Algoritmo Python'}
              </button>
            )}
          </div>

          {showCode && codeSnippet && (
            <div class="bg-[#060914] p-4 rounded-xl border border-cyan-500/30 text-slate-300 overflow-x-auto text-[11px] leading-relaxed">
              <pre>{codeSnippet}</pre>
            </div>
          )}
        </div>
      );
    }

    // =========================================================
    // 1. ARREGLO 1D CON MÚLTIPLES ALGORITMOS DE ORDENAMIENTO
    // =========================================================
    function ArregloModulo({ showToast, triggerCelebration, sound, animSpeed }) {
      const [tamano, setTamano] = useState('');
      const [arreglo, setArreglo] = useState([45, 12, 89, 34, 67, 23, 90, 11]);
      const [isCreated, setIsCreated] = useState(true);
      const [searchIndex, setSearchIndex] = useState('');
      const [modIndex, setModIndex] = useState('');
      const [modValue, setModValue] = useState('');
      const [highlightedIndex, setHighlightedIndex] = useState(null);
      const [isSorting, setIsSorting] = useState(false);
      const [comparingIndices, setComparingIndices] = useState([]);
      const [algorithm, setAlgorithm] = useState('bubble');

      const delay = (ms) => new Promise(r => setTimeout(r, ms / animSpeed));

      const crearArreglo = () => {
        const val = parseInt(tamano);
        if (isNaN(val) || val <= 0 || val > 16) {
          showToast('❌ Ingrese un tamaño válido entre 1 y 16.', 'error');
          return;
        }
        const nuevoArr = Array.from({ length: val }, () => Math.floor(Math.random() * 85) + 10);
        setArreglo(nuevoArr);
        setIsCreated(true);
        if (sound) playSound('insert');
        showToast(`✅ Arreglo de ${val} elementos asignado en RAM.`);
      };

      const consultarIndice = () => {
        const idx = parseInt(searchIndex);
        if (isNaN(idx) || idx < 0 || idx >= arreglo.length) {
          showToast(`❌ Error: Índice fuera de rango (0 a ${arreglo.length - 1}).`, 'error');
          return;
        }
        setHighlightedIndex(idx);
        if (sound) playSound('click');
        showToast(`👉 Memoria [${getHexAddr(0x7FFF10, idx)}] = ${arreglo[idx]}`);
      };

      const modificarIndice = () => {
        const idx = parseInt(modIndex);
        const val = parseInt(modValue);
        if (isNaN(idx) || idx < 0 || idx >= arreglo.length) {
          showToast(`❌ Error: Índice fuera de rango.`, 'error');
          return;
        }
        if (isNaN(val)) {
          showToast('❌ Valor inválido.', 'error');
          return;
        }
        const copia = [...arreglo];
        copia[idx] = val;
        setArreglo(copia);
        setHighlightedIndex(idx);
        if (sound) playSound('success');
        showToast(`✅ Celda [${idx}] modificada a ${val}.`);
      };

      const ejecutarOrdenamiento = async () => {
        setIsSorting(true);
        let arr = [...arreglo];
        let n = arr.length;

        if (algorithm === 'bubble') {
          for (let i = 0; i < n - 1; i++) {
            for (let j = 0; j < n - i - 1; j++) {
              setComparingIndices([j, j + 1]);
              if (sound) playSound('click');
              await delay(250);

              if (arr[j] > arr[j + 1]) {
                let temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
                setArreglo([...arr]);
                if (sound) playSound('push');
                await delay(250);
              }
            }
          }
        } else if (algorithm === 'selection') {
          for (let i = 0; i < n - 1; i++) {
            let minIdx = i;
            for (let j = i + 1; j < n; j++) {
              setComparingIndices([minIdx, j]);
              if (sound) playSound('click');
              await delay(250);
              if (arr[j] < arr[minIdx]) minIdx = j;
            }
            if (minIdx !== i) {
              let temp = arr[i];
              arr[i] = arr[minIdx];
              arr[minIdx] = temp;
              setArreglo([...arr]);
              if (sound) playSound('push');
              await delay(250);
            }
          }
        }

        setComparingIndices([]);
        setIsSorting(false);
        triggerCelebration();
        showToast(`🎉 ¡Arreglo ordenado mediante ${algorithm.toUpperCase()}!`);
      };

      return (
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-4 gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="bar-chart-3" className="text-cyan-400" />
                1. Arreglo Unidimensional & SIMD Ordenamiento
              </h2>
              <p class="text-xs text-slate-400">Direccionamiento contiguo en RAM e inspección paso a paso.</p>
            </div>
            <button onClick={() => setIsCreated(!isCreated)} class="text-xs bg-slate-900 hover:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-cyan-300 font-mono">
              {isCreated ? 'Reconfigurar Tamaño' : 'Ver Arreglo'}
            </button>
          </div>

          <ComplexityBadge 
            access="O(1)" search="O(N)" insert="O(N)" deleteOp="O(N)"
            codeSnippet={`# Algoritmo de Ordenamiento Bubble Sort en Arreglo 1D
def bubble_sort(arreglo):
    n = len(arreglo)
    for i in range(n - 1):
        for j in range(0, n - i - 1):
            if arreglo[j] > arreglo[j + 1]:
                arreglo[j], arreglo[j + 1] = arreglo[j + 1], arreglo[j]`}
          />

          {!isCreated ? (
            <div class="max-w-md bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
              <label class="block text-xs font-semibold text-slate-300 font-mono">Cantidad de elementos (1 a 16):</label>
              <input type="number" value={tamano} onChange={e => setTamano(e.target.value)} placeholder="Ej. 8" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-mono focus:outline-none focus:border-cyan-500" />
              <button onClick={crearArreglo} class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold py-2.5 rounded-xl transition shadow-lg shadow-cyan-600/30">
                Inicializar Arreglo en RAM
              </button>
            </div>
          ) : (
            <div class="space-y-6">
              <div class="bg-slate-955 p-6 rounded-3xl border border-slate-800 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-4">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-mono text-slate-400">Algoritmo:</span>
                    <select value={algorithm} onChange={e=>setAlgorithm(e.target.value)} class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-cyan-300 font-mono">
                      <option value="bubble">Bubble Sort O(N²)</option>
                      <option value="selection">Selection Sort O(N²)</option>
                    </select>
                  </div>

                  <button 
                    disabled={isSorting}
                    onClick={ejecutarOrdenamiento} 
                    class="bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-lg shadow-cyan-600/30 disabled:opacity-50"
                  >
                    <Icon name="play" className="w-4 h-4" />
                    {isSorting ? 'Ejecutando...' : 'Simular Algoritmo'}
                  </button>
                </div>

                <div class="h-60 flex items-end justify-center gap-2.5 pt-6 pb-2 px-4 border-b border-slate-800/80 overflow-x-auto custom-scrollbar">
                  {arreglo.map((val, idx) => {
                    const isComparing = comparingIndices.includes(idx);
                    const isSelected = highlightedIndex === idx;
                    return (
                      <div key={idx} class="flex flex-col items-center gap-2 flex-1 max-w-[55px]">
                        <span class="text-xs font-bold text-white font-mono">{val}</span>
                        <div 
                          style={{ height: `${val * 1.9}px` }}
                          class={`w-full rounded-t-xl bar-sort flex items-center justify-center transition-all ${
                            isComparing ? 'bg-amber-400 scale-105 shadow-xl shadow-amber-400/50' : 
                            isSelected ? 'bg-emerald-400 scale-105 shadow-xl shadow-emerald-400/50' : 
                            'bg-gradient-to-t from-indigo-700 to-cyan-500 hover:from-indigo-600 hover:to-cyan-400'
                          }`}
                        ></div>
                        <span class="text-[9px] font-mono text-cyan-400 bg-slate-900 px-1 py-0.5 rounded border border-slate-800 truncate w-full text-center" title={getHexAddr(0x7FFF10, idx)}>
                          {getHexAddr(0x7FFF10, idx).substring(6)}
                        </span>
                        <span class="text-[10px] font-mono text-slate-500">[{idx}]</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <h4 class="text-xs font-mono font-semibold text-cyan-300">1. Consultar por Índice O(1)</h4>
                  <div class="flex gap-2">
                    <input type="number" placeholder="Índice" value={searchIndex} onChange={e=>setSearchIndex(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                    <button onClick={consultarIndice} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold font-mono">Consultar</button>
                  </div>
                </div>

                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                  <h4 class="text-xs font-mono font-semibold text-cyan-300">2. Modificar Elemento</h4>
                  <div class="flex gap-2">
                    <input type="number" placeholder="Índice" value={modIndex} onChange={e=>setModIndex(e.target.value)} class="w-1/3 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                    <input type="number" placeholder="Nuevo valor" value={modValue} onChange={e=>setModValue(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono" />
                    <button onClick={modificarIndice} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold font-mono">Guardar</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================
    // 2. MATRIZ BIDIMENSIONAL CON ROW-MAJOR MAPPER
    // =========================================================
    function MatrizModulo({ showToast, sound }) {
      const [filas, setFilas] = useState('3');
      const [cols, setCols] = useState('3');
      const [matriz, setMatriz] = useState([
        [14, 88, 32],
        [65, 42, 91],
        [27, 53, 76]
      ]);
      const [isCreated, setIsCreated] = useState(true);
      const [selFila, setSelFila] = useState('');
      const [selCol, setSelCol] = useState('');
      const [modVal, setModVal] = useState('');
      const [highlightCell, setHighlightCell] = useState(null);

      const crearMatriz = () => {
        const f = parseInt(filas);
        const c = parseInt(cols);
        if (isNaN(f) || f <= 0 || f > 5 || isNaN(c) || c <= 0 || c > 5) {
          showToast('❌ Filas y columnas entre 1 y 5.', 'error');
          return;
        }
        const m = Array.from({ length: f }, () =>
          Array.from({ length: c }, () => Math.floor(Math.random() * 89) + 10)
        );
        setMatriz(m);
        setIsCreated(true);
        if (sound) playSound('insert');
        showToast(`✅ Matriz ${f}x${c} mapeada en RAM (${f*c} posiciones).`);
      };

      const consultarCelda = () => {
        const f = parseInt(selFila);
        const c = parseInt(selCol);
        if (isNaN(f) || isNaN(c) || f < 0 || f >= matriz.length || c < 0 || c >= matriz[0].length) {
          showToast('❌ Coordenadas fuera de rango.', 'error');
          return;
        }
        setHighlightCell({ f, c });
        if (sound) playSound('click');
        const linearIdx = f * matriz[0].length + c;
        showToast(`👉 Matriz[${f}][${c}] = ${matriz[f][c]} (Dirección Offset RAM: +${linearIdx * 4}B)`);
      };

      const modificarCelda = () => {
        const f = parseInt(selFila);
        const c = parseInt(selCol);
        const val = parseInt(modVal);
        if (isNaN(f) || isNaN(c) || f < 0 || f >= matriz.length || c < 0 || c >= matriz[0].length) {
          showToast('❌ Coordenada inválida.', 'error');
          return;
        }
        if (isNaN(val)) {
          showToast('❌ Valor no numérico.', 'error');
          return;
        }
        const nueva = matriz.map(r => [...r]);
        nueva[f][c] = val;
        setMatriz(nueva);
        setHighlightCell({ f, c });
        if (sound) playSound('success');
        showToast(`✅ Celda [${f}][${c}] actualizada a ${val}.`);
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="grid" className="text-cyan-400" />
                2. Matriz Bidimensional (2D) & Row-Major Order
              </h2>
              <p class="text-xs text-slate-400">Mapeo de memoria bidimensional contigua [Fila × Columna].</p>
            </div>
            <button onClick={() => setIsCreated(!isCreated)} class="text-xs bg-slate-900 hover:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-cyan-300 font-mono">
              {isCreated ? 'Reconfigurar Matriz' : 'Ver Matriz'}
            </button>
          </div>

          <ComplexityBadge 
            access="O(1)" search="O(F × C)" insert="O(1)" deleteOp="N/A"
            codeSnippet={`# Acceso directo en Matriz 2D mediante offset de fila mayor
def consultar_celda(matriz, fila, col, num_cols):
    # En memoria RAM contigua la dirección es: Base + (fila * num_cols + col) * sizeof(tipo)
    return matriz[fila][col]`}
          />

          {!isCreated ? (
            <div class="max-w-md bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1 font-mono">Filas (1-5):</label>
                  <input type="number" value={filas} onChange={e=>setFilas(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1 font-mono">Columnas (1-5):</label>
                  <input type="number" value={cols} onChange={e=>setCols(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                </div>
              </div>
              <button onClick={crearMatriz} class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 text-white font-bold py-2.5 rounded-xl">
                Generar Matriz
              </button>
            </div>
          ) : (
            <div class="space-y-6">
              <div class="bg-slate-955 p-6 rounded-3xl border border-slate-800 overflow-x-auto">
                <table class="border-separate border-spacing-3 mx-auto">
                  <thead>
                    <tr>
                      <th class="p-2 text-xs font-mono text-slate-500">f\c</th>
                      {matriz[0].map((_, c) => (
                        <th key={c} class="p-2 text-xs font-mono text-cyan-400 font-bold">Col {c}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {matriz.map((row, f) => (
                      <tr key={f}>
                        <td class="p-2 text-xs font-mono text-cyan-400 font-bold">Fila {f}</td>
                        {row.map((cell, c) => {
                          const isSel = highlightCell?.f === f && highlightCell?.c === c;
                          const offset = f * matriz[0].length + c;
                          return (
                            <td key={c}>
                              <div class={`w-20 h-20 rounded-2xl flex flex-col items-center justify-center font-bold border transition-all duration-300 ${
                                isSel ? 'bg-indigo-600 border-cyan-300 text-white scale-110 shadow-2xl shadow-indigo-500/50 pulse-glow' : 'bg-slate-900 border-slate-800 text-slate-200 hover:border-slate-700'
                              }`}>
                                <span class="text-lg font-mono">{cell}</span>
                                <span class="text-[9px] font-mono text-slate-500">[{f}][{c}]</span>
                                <span class="text-[8px] font-mono text-cyan-400/80">{getHexAddr(0x7FFF30, offset)}</span>
                              </div>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-wrap gap-4 items-center justify-between font-mono">
                <div class="flex items-center gap-2">
                  <input type="number" placeholder="Fila" value={selFila} onChange={e=>setSelFila(e.target.value)} class="w-20 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  <input type="number" placeholder="Col" value={selCol} onChange={e=>setSelCol(e.target.value)} class="w-20 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  <button onClick={consultarCelda} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold">Consultar</button>
                </div>
                <div class="flex items-center gap-2">
                  <input type="number" placeholder="Nuevo valor" value={modVal} onChange={e=>setModVal(e.target.value)} class="w-28 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                  <button onClick={modificarCelda} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Modificar Celda</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================
    // 3. LISTA ENLAZADA CON PUNTEROS EN MEMORIA HEAP
    // =========================================================
    function ListaModulo({ showToast, sound }) {
      const [lista, setLista] = useState([
        { val: 12, addr: '0x8FA0', next: '0x8FA8' },
        { val: 38, addr: '0x8FA8', next: '0x8FC0' },
        { val: 55, addr: '0x8FC0', next: '0x8FD4' },
        { val: 91, addr: '0x8FD4', next: 'NULL' }
      ]);
      const [nuevoValor, setNuevoValor] = useState('');
      const [buscarVal, setBuscarVal] = useState('');
      const [highlightIdx, setHighlightIdx] = useState(null);

      const insertarNodo = () => {
        const val = parseInt(nuevoValor);
        if (isNaN(val)) {
          showToast('❌ Ingrese un entero válido.', 'error');
          return;
        }
        const newAddr = '0x' + (Math.floor(Math.random() * 0xFFF) + 0x8000).toString(16).toUpperCase();
        
        let copia = [...lista];
        if (copia.length > 0) {
          copia[copia.length - 1].next = newAddr;
        }
        copia.push({ val, addr: newAddr, next: 'NULL' });

        setLista(copia);
        setNuevoValor('');
        if (sound) playSound('insert');
        showToast(`✅ Nuevo nodo (${val}) alojado en dirección Heap [${newAddr}].`);
      };

      const eliminarNodo = (val) => {
        const idx = lista.findIndex(n => n.val === val);
        if (idx === -1) {
          showToast('❌ Dato no encontrado en la lista.', 'error');
          return;
        }
        let copia = lista.filter((_, i) => i !== idx);
        if (idx > 0 && idx - 1 < copia.length) {
          copia[idx - 1].next = idx < lista.length - 1 ? copia[idx].addr : 'NULL';
        }
        setLista(copia);
        if (sound) playSound('delete');
        showToast(`✅ Nodo ${val} desasignado de la memoria Heap.`);
      };

      const buscarNodo = () => {
        const val = parseInt(buscarVal);
        const idx = lista.findIndex(n => n.val === val);
        if (idx === -1) {
          setHighlightIdx(null);
          showToast(`❌ El valor ${val} NO existe en los nodos enlazados.`, 'warning');
        } else {
          setHighlightIdx(idx);
          if (sound) playSound('click');
          showToast(`👉 Nodo hallado en dirección Heap ${lista[idx].addr}.`);
        }
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="git-commit" className="text-cyan-400" />
                3. Lista Enlazada Dinámica (Memoria Heap)
              </h2>
              <p class="text-xs text-slate-400">Nodos no contiguos enlazados mediante punteros de memoria explícitos.</p>
            </div>
          </div>

          <ComplexityBadge 
            access="O(N)" search="O(N)" insert="O(1)" deleteOp="O(1)"
            codeSnippet={`# Nodo de Lista Simplemente Enlazada
class Nodo:
    def __init__(self, valor):
        self.valor = valor
        self.siguiente = None`}
          />

          <div class="bg-slate-955 p-8 rounded-3xl border border-slate-800 overflow-x-auto custom-scrollbar">
            <div class="flex items-center gap-4 min-w-max py-4 font-mono">
              <div class="bg-indigo-950/80 border border-indigo-500 px-4 py-3 rounded-2xl text-cyan-300 text-xs font-bold shadow-lg shadow-indigo-500/20">
                <div>HEAD</div>
                <div class="text-[9px] text-slate-400">{lista.length > 0 ? lista[0].addr : 'NULL'}</div>
              </div>
              <Icon name="arrow-right" className="text-cyan-400 w-5 h-5 animate-pulse" />

              {lista.length === 0 ? (
                <span class="text-slate-600 text-sm">Lista Vacía (NULL)</span>
              ) : (
                lista.map((node, idx) => {
                  const isSel = highlightIdx === idx;
                  return (
                    <React.Fragment key={idx}>
                      <div class={`node-pop glass-panel rounded-2xl p-4 flex items-center gap-4 border transition-all duration-300 ${
                        isSel ? 'border-cyan-400 bg-indigo-600/30 scale-105 shadow-2xl shadow-cyan-500/30 pulse-glow' : 'border-slate-800 hover:border-slate-700'
                      }`}>
                        <div class="flex flex-col">
                          <span class="text-[9px] text-cyan-400">ADDR: {node.addr}</span>
                          <span class="text-xl font-bold text-white">{node.val}</span>
                        </div>
                        <div class="h-10 w-px bg-slate-800"></div>
                        <div class="flex flex-col items-center">
                          <span class="text-[9px] text-slate-500">NEXT</span>
                          <span class="text-[10px] text-emerald-400 font-bold">{node.next}</span>
                        </div>
                        <button onClick={() => eliminarNodo(node.val)} class="text-slate-500 hover:text-rose-400 transition ml-2">
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                      <Icon name="arrow-right" className="text-slate-600 w-5 h-5" />
                    </React.Fragment>
                  );
                })
              )}

              <div class="bg-slate-900 border border-slate-800 px-4 py-3 rounded-2xl text-slate-500 text-xs font-bold">
                NULL
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex gap-2 font-mono">
              <input type="number" placeholder="Nuevo valor" value={nuevoValor} onChange={e=>setNuevoValor(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              <button onClick={insertarNodo} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">
                Insertar Nodo
              </button>
            </div>
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex gap-2 font-mono">
              <input type="number" placeholder="Buscar valor" value={buscarVal} onChange={e=>setBuscarVal(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              <button onClick={buscarNodo} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold">
                Buscar Nodo
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 4. PILA (STACK - LIFO)
    // =========================================================
    function PilaModulo({ showToast, sound }) {
      const [pila, setPila] = useState([18, 42, 77]);
      const [inputVal, setInputVal] = useState('');

      const push = () => {
        const val = parseInt(inputVal);
        if (isNaN(val)) {
          showToast('❌ Ingrese un entero válido.', 'error');
          return;
        }
        setPila([...pila, val]);
        setInputVal('');
        if (sound) playSound('push');
        showToast(`✅ Push: ${val} apilado en la cima.`);
      };

      const pop = () => {
        if (pila.length === 0) {
          showToast('❌ Underflow: Intento de retirado en PILA VACÍA.', 'error');
          return;
        }
        const copia = [...pila];
        const rem = copia.pop();
        setPila(copia);
        if (sound) playSound('pop');
        showToast(`✅ Pop: Extraído elemento ${rem} de la Cima.`);
      };

      const peek = () => {
        if (pila.length === 0) {
          showToast('❌ La pila está vacía.', 'warning');
          return;
        }
        if (sound) playSound('click');
        showToast(`👉 Cima actual (Peek): ${pila[pila.length - 1]}`);
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="layers" className="text-cyan-400" />
                4. Pila Animada (Stack - LIFO)
              </h2>
              <p class="text-xs text-slate-400">Last In, First Out (Último en Entrar, Primero en Salir).</p>
            </div>
          </div>

          <ComplexityBadge 
            access="O(N)" search="O(N)" insert="O(1)" deleteOp="O(1)"
            codeSnippet={`# Estructura Pila (Stack) LIFO
pila = []
pila.append(10)  # Push O(1)
top = pila[-1]   # Peek O(1)
elem = pila.pop() # Pop O(1)`}
          />

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <div class="bg-slate-955 p-6 rounded-3xl border border-slate-800 flex flex-col items-center min-h-[360px]">
              <span class="text-xs font-mono font-bold text-cyan-400 mb-4 px-3 py-1 bg-indigo-950/80 rounded-full border border-indigo-700">
                ▲ CIMA (TOP OF STACK) ▲
              </span>

              <div class="w-60 flex flex-col gap-2.5">
                {pila.length === 0 ? (
                  <div class="py-20 text-center text-slate-600 font-mono text-sm border border-dashed border-slate-800 rounded-2xl">Pila Vacía</div>
                ) : (
                  [...pila].reverse().map((val, idx) => {
                    const isTop = idx === 0;
                    return (
                      <div 
                        key={idx} 
                        class={`node-pop p-4 rounded-2xl border font-bold text-center text-lg transition-all font-mono ${
                          isTop ? 'bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-500 border-cyan-300 text-white shadow-2xl shadow-indigo-500/50 pulse-glow' : 'bg-slate-900 border-slate-800 text-slate-300'
                        }`}
                      >
                        <div class="flex justify-between items-center px-2">
                          <span class="text-xs font-mono opacity-70">{isTop ? '[TOP]' : ''}</span>
                          <span>{val}</span>
                          <span class="text-xs font-mono opacity-50">Pos {pila.length - 1 - idx}</span>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
              <span class="text-xs font-mono text-slate-600 mt-auto pt-4 border-t border-slate-800 w-full text-center">BASE DE LA PILA</span>
            </div>

            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4 font-mono">
              <h4 class="text-xs font-semibold text-white">Operaciones LIFO:</h4>
              <div class="flex gap-2">
                <input type="number" placeholder="Valor" value={inputVal} onChange={e=>setInputVal(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                <button onClick={push} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30">Apilar (Push)</button>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button onClick={pop} class="bg-rose-950/60 border border-rose-800/80 hover:bg-rose-900 text-rose-200 py-2.5 rounded-xl text-xs font-semibold">Desapilar (Pop)</button>
                <button onClick={peek} class="bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl text-xs font-semibold">Cima (Peek)</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 5. COLA (QUEUE - FIFO)
    // =========================================================
    function ColaModulo({ showToast, sound }) {
      const [cola, setCola] = useState([10, 20, 30, 40]);
      const [inputVal, setInputVal] = useState('');

      const enqueue = () => {
        const val = parseInt(inputVal);
        if (isNaN(val)) {
          showToast('❌ Ingrese un entero válido.', 'error');
          return;
        }
        setCola([...cola, val]);
        setInputVal('');
        if (sound) playSound('push');
        showToast(`✅ Enqueue: Elemento ${val} ingresado al final.`);
      };

      const dequeue = () => {
        if (cola.length === 0) {
          showToast('❌ Underflow: COLA VACÍA.', 'error');
          return;
        }
        const rem = cola[0];
        setCola(cola.slice(1));
        if (sound) playSound('pop');
        showToast(`✅ Dequeue: Elemento ${rem} retirado del frente.`);
      };

      const peek = () => {
        if (cola.length === 0) {
          showToast('❌ Cola vacía.', 'warning');
          return;
        }
        if (sound) playSound('click');
        showToast(`👉 Frente (Peek): ${cola[0]}`);
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="arrow-right-left" className="text-cyan-400" />
                5. Cola Animada (Queue - FIFO)
              </h2>
              <p class="text-xs text-slate-400">First In, First Out (Primero en Entrar, Primero en Salir).</p>
            </div>
          </div>

          <ComplexityBadge 
            access="O(N)" search="O(N)" insert="O(1)" deleteOp="O(1)"
            codeSnippet={`# Estructura Cola FIFO con deque
from collections import deque
cola = deque()
cola.append(10)      # Enqueue O(1)
frente = cola[0]     # Peek O(1)
elem = cola.popleft()# Dequeue O(1)`}
          />

          <div class="bg-slate-955 p-8 rounded-3xl border border-slate-800 overflow-x-auto custom-scrollbar">
            <div class="flex items-center gap-4 min-w-max py-4 font-mono">
              <span class="text-xs font-bold text-emerald-400 bg-emerald-950/80 border border-emerald-700 px-3.5 py-2 rounded-xl shadow-lg shadow-emerald-500/20">FRENTE (Dequeue)</span>
              <Icon name="arrow-right" className="text-emerald-400 w-5 h-5 animate-pulse" />

              {cola.length === 0 ? (
                <span class="text-slate-600 text-sm px-8">Cola Vacía</span>
              ) : (
                cola.map((val, idx) => {
                  const isFront = idx === 0;
                  return (
                    <div 
                      key={idx} 
                      class={`node-pop p-4 rounded-2xl border font-bold text-lg text-center min-w-[75px] ${
                        isFront ? 'bg-gradient-to-tr from-emerald-600 to-teal-500 border-emerald-300 text-white shadow-2xl shadow-emerald-500/30 pulse-glow' : 'bg-slate-900 border-slate-800 text-slate-300'
                      }`}
                    >
                      {val}
                    </div>
                  );
                })
              )}

              <Icon name="arrow-right" className="text-cyan-400 w-5 h-5" />
              <span class="text-xs font-bold text-cyan-400 bg-indigo-950/80 border border-indigo-700 px-3.5 py-2 rounded-xl shadow-lg shadow-indigo-500/20">FINAL (Enqueue)</span>
            </div>
          </div>

          <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-wrap gap-4 items-center justify-between font-mono">
            <div class="flex gap-2 flex-1 min-w-[200px]">
              <input type="number" placeholder="Valor" value={inputVal} onChange={e=>setInputVal(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              <button onClick={enqueue} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30">Enqueue</button>
            </div>
            <div class="flex gap-2">
              <button onClick={dequeue} class="bg-rose-950/60 border border-rose-800/80 hover:bg-rose-900 text-rose-200 px-4 py-2 rounded-xl text-xs font-semibold">Dequeue</button>
              <button onClick={peek} class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-semibold">Frente (Peek)</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 6. ÁRBOL BINARIO DE BÚSQUEDA (BST) EN CANVAS 2D
    // =========================================================
    function ArbolModulo({ showToast, sound, animSpeed }) {
      const [nodes, setNodes] = useState([50, 30, 70, 20, 40, 60, 80]);
      const [valInput, setValInput] = useState('');
      const [recorridoResult, setRecorridoResult] = useState('');
      const canvasRef = useRef(null);

      const insertar = () => {
        const val = parseInt(valInput);
        if (isNaN(val)) {
          showToast('❌ Ingrese un entero válido.', 'error');
          return;
        }
        if (nodes.includes(val)) {
          showToast(`⚠️ Valor ${val} DUPLICADO. Política: Se omite según la regla del árbol.`, 'warning');
          return;
        }
        setNodes([...nodes, val]);
        setValInput('');
        if (sound) playSound('insert');
        showToast(`✅ Nodo ${val} insertado jerárquicamente.`);
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (nodes.length === 0) return;
        let root = { val: nodes[0], left: null, right: null };
        const insertRec = (node, v) => {
          if (v < node.val) {
            if (!node.left) node.left = { val: v, left: null, right: null };
            else insertRec(node.left, v);
          } else {
            if (!node.right) node.right = { val: v, left: null, right: null };
            else insertRec(node.right, v);
          }
        };
        for (let i = 1; i < nodes.length; i++) insertRec(root, nodes[i]);

        const drawNode = (node, x, y, offset) => {
          if (!node) return;

          if (node.left) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - offset, y + 60);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.stroke();
            drawNode(node.left, x - offset, y + 60, offset / 1.8);
          }

          if (node.right) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + offset, y + 60);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.stroke();
            drawNode(node.right, x + offset, y + 60, offset / 1.8);
          }

          ctx.beginPath();
          ctx.arc(x, y, 22, 0, 2 * Math.PI);
          ctx.fillStyle = '#4f46e5';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#38bdf8';
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px Plus Jakarta Sans';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(node.val, x, y);
        };

        drawNode(root, canvas.width / 2, 40, 140);
      }, [nodes]);

      const runInorden = () => {
        let res = [];
        const inorden = (n) => { if(n) { inorden(n.left); res.push(n.val); inorden(n.right); } };
        let root = { val: nodes[0], left: null, right: null };
        for (let i = 1; i < nodes.length; i++) {
          let act = root;
          while(true) {
            if(nodes[i] < act.val) { if(!act.left){ act.left = {val:nodes[i],left:null,right:null}; break;} act=act.left; }
            else { if(!act.right){ act.right = {val:nodes[i],left:null,right:null}; break;} act=act.right; }
          }
        }
        inorden(root);
        if (sound) playSound('success');
        setRecorridoResult(`Inorden (Izq, Raíz, Der): [ ${res.join(' → ')} ]`);
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="network" className="text-cyan-400" />
                6. Árbol Binario de Búsqueda (Canvas 2D)
              </h2>
              <p class="text-xs text-slate-400">Jerarquía no lineal de nodos con propiedad de ordenamiento estricto.</p>
            </div>
          </div>

          <ComplexityBadge 
            access="O(log N)" search="O(log N)" insert="O(log N)" deleteOp="O(log N)"
            codeSnippet={`# Inserción recursiva en Árbol Binario de Búsqueda (BST)
def insertar(nodo, valor):
    if nodo is None:
        return NodoBST(valor)
    if valor < nodo.valor:
        nodo.izq = insertar(nodo.izq, valor)
    elif valor > nodo.valor:
        nodo.der = insertar(nodo.der, valor)
    return nodo`}
          />

          <div class="bg-slate-955 p-4 rounded-3xl border border-slate-800 overflow-x-auto flex justify-center">
            <canvas ref={canvasRef} width="720" height="320" class="bg-slate-955 rounded-2xl"></canvas>
          </div>

          {recorridoResult && (
            <div class="bg-indigo-950/80 border border-indigo-500 p-4 rounded-2xl text-cyan-200 font-mono text-sm shadow-xl">
              {recorridoResult}
            </div>
          )}

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono">
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex gap-2">
              <input type="number" placeholder="Valor nodo" value={valInput} onChange={e=>setValInput(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
              <button onClick={insertar} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Insertar Nodo</button>
            </div>
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex gap-2">
              <button onClick={runInorden} class="flex-1 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded-xl">Recorrido Inorden</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================
    // 7. GRAFO INTERACTIVO EN CANVAS CON BFS ANIMADO
    // =========================================================
    function GrafoModulo({ showToast, triggerCelebration, sound, animSpeed }) {
      const [vertices, setVertices] = useState(['A', 'B', 'C', 'D', 'E']);
      const [aristas, setAristas] = useState([['A','B'], ['B','C'], ['C','D'], ['A','E']]);
      const [nuevoV, setNuevoV] = useState('');
      const [origA, setOrigA] = useState('');
      const [destA, setDestA] = useState('');
      const [bfsVisited, setBfsVisited] = useState([]);
      const canvasRef = useRef(null);

      const delay = (ms) => new Promise(r => setTimeout(r, ms / animSpeed));

      const agregarV = () => {
        const v = nuevoV.trim().toUpperCase();
        if (!v) return;
        if (vertices.includes(v)) {
          showToast(`⚠️ Vértice '${v}' DUPLICADO. Identificadores deben ser únicos.`, 'warning');
          return;
        }
        setVertices([...vertices, v]);
        setNuevoV('');
        if (sound) playSound('insert');
        showToast(`✅ Vértice '${v}' registrado.`);
      };

      const agregarArista = () => {
        const u = origA.trim().toUpperCase();
        const v = destA.trim().toUpperCase();
        if (!vertices.includes(u) || !vertices.includes(v)) {
          showToast('❌ Uno o ambos vértices no existen.', 'error');
          return;
        }
        if (u === v) {
          showToast('⚠️ No se permiten autobucles en el grafo.', 'warning');
          return;
        }
        setAristas([...aristas, [u, v]]);
        if (sound) playSound('success');
        showToast(`✅ Conexión registrada entre '${u}' y '${v}'.`);
      };

      const simularBFS = async () => {
        if (vertices.length === 0) return;
        let inicio = vertices[0];
        let visitados = new Set([inicio]);
        let cola = [inicio];
        let orden = [];

        while (cola.length > 0) {
          let curr = cola.shift();
          orden.push(curr);
          setBfsVisited([...orden]);
          if (sound) playSound('click');
          await delay(600);

          let vecinos = aristas
            .filter(([u, w]) => u === curr || w === curr)
            .map(([u, w]) => u === curr ? w : u);

          for (let vec of vecinos) {
            if (!visitados.has(vec)) {
              visitados.add(vec);
              cola.push(vec);
            }
          }
        }
        triggerCelebration();
        showToast(`🌐 Recorrido BFS completado desde '${inicio}'.`);
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const n = vertices.length;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 120;

        const coords = {};
        vertices.forEach((v, i) => {
          const angle = (i * 2 * Math.PI) / n;
          coords[v] = {
            x: centerX + radius * Math.cos(angle),
            y: centerY + radius * Math.sin(angle)
          };
        });

        aristas.forEach(([u, v]) => {
          if (coords[u] && coords[v]) {
            ctx.beginPath();
            ctx.moveTo(coords[u].x, coords[u].y);
            ctx.lineTo(coords[v].x, coords[v].y);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        });

        vertices.forEach(v => {
          const pt = coords[v];
          const isVisited = bfsVisited.includes(v);

          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 22, 0, 2 * Math.PI);
          ctx.fillStyle = isVisited ? '#10b981' : '#4f46e5';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = isVisited ? '#6ee7b7' : '#38bdf8';
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px Plus Jakarta Sans';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(v, pt.x, pt.y);
        });
      }, [vertices, aristas, bfsVisited]);

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <Icon name="share-2" className="text-cyan-400" />
                7. Grafo No Dirigido (Canvas 2D + Onda BFS)
              </h2>
              <p class="text-xs text-slate-400">Vértices, listas de adyacencia y propagación de ondas de búsqueda.</p>
            </div>
          </div>

          <ComplexityBadge 
            access="N/A" search="O(V + E)" insert="O(1)" deleteOp="O(E)"
            codeSnippet={`# Recorrido en Anchura (BFS) usando Cola Auxiliar
def bfs(grafo, vertice_inicial):
    visitados = set([vertice_inicial])
    cola = deque([vertice_inicial])
    while cola:
        vert = cola.popleft()
        for vecino in grafo[vert]:
            if vecino not in visitados:
                visitados.add(vecino)
                cola.append(vecino)`}
          />

          <div class="bg-slate-955 p-4 rounded-3xl border border-slate-800 overflow-x-auto flex justify-center relative">
            <canvas ref={canvasRef} width="660" height="300" class="bg-slate-955 rounded-2xl"></canvas>
            <button onClick={simularBFS} class="absolute bottom-6 right-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center gap-2 font-mono">
              <Icon name="play" className="w-4 h-4" />
              Simular BFS
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono">
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
              <h4 class="text-xs font-semibold text-slate-400">Agregar Vértice</h4>
              <div class="flex gap-2">
                <input type="text" placeholder="ID (ej. F)" value={nuevoV} onChange={e=>setNuevoV(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                <button onClick={agregarV} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Crear</button>
              </div>
            </div>

            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
              <h4 class="text-xs font-semibold text-slate-400">Conectar Arista</h4>
              <div class="flex gap-2">
                <input type="text" placeholder="Origen" value={origA} onChange={e=>setOrigA(e.target.value)} class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                <input type="text" placeholder="Destino" value={destA} onChange={e=>setDestA(e.target.value)} class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                <button onClick={agregarArista} class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Conectar</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
